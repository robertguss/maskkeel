[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "maskkeel"
dynamic = ["version"]
description = "Blazing-fast, deterministic, referentially-intact Rust PII/FERPA data scrubber for CSV, JSONL, Parquet, SQLite, and PostgreSQL."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.9"
keywords = ["pii", "anonymization", "ferpa", "gdpr", "hipaa", "postgres", "sqlite", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/robertguss/maskkeel"
Repository = "https://github.com/robertguss/maskkeel"
Issues = "https://github.com/robertguss/maskkeel/issues"

[tool.maturin]
bindings = "bin"
features = ["vendored-tls"]
compatibility = "pypi"
strip = true
